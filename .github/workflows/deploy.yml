name: Deploy

# development → staging, main → production. Each GitHub environment holds:
#   secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and DATABASE_URL_UNPOOLED (that
#   environment's direct Neon URL, no -pooler; the Worker's own DATABASE_URL is the pooled one)
#   variables: PUBLIC_URL (the origin people load the app from, e.g. https://example.com)
# The Worker's own secrets (ANTHROPIC_API_KEY, BETTER_AUTH_SECRET, RESEND_API_KEY, ...) are set
# once with `wrangler secret put --env <env>`; see README.md.
on:
  push:
    branches: [main, development]
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    # Never run two deploys (and their migrations) for the same environment at once.
    concurrency: deploy-${{ github.ref_name }}
    env:
      WRANGLER_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @rlo/web
      # Migrations run before the new code goes live, so each one must keep the running version
      # working (add columns and tables; drop them in a later deploy). Over the direct connection:
      # PgBouncer's transaction pooling breaks session-level work like migrations.
      - run: npm run db:migrate -w @rlo/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      - run: >
          npx wrangler deploy --env "$WRANGLER_ENV"
          --var "PUBLIC_URL:$PUBLIC_URL" --var "CORS_ORIGINS:$PUBLIC_URL"
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
